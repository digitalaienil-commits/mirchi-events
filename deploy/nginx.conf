# Nginx reverse proxy for Mirchi Events.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/mirchi-events
#          sudo ln -s /etc/nginx/sites-available/mirchi-events /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d events.example.com
server {
    listen 80;
    server_name events.example.com;   # ← your domain

    # Posters can be up to 4 MB
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
